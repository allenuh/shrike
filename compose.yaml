# Local storage/broker prerequisites. API, dispatcher and scanner worker run on the trusted host.
services:
  postgres:
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    environment:
      POSTGRES_DB: shrike_demo
      POSTGRES_USER: shrike
      POSTGRES_PASSWORD: ${SHRIKE_LOCAL_DB_PASSWORD:?Generate and export a local password}
    ports:
      - "127.0.0.1:${SHRIKE_LOCAL_DB_PORT:-55432}:5432"
    volumes:
      - shrike_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shrike -d shrike_demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    profiles: [queue]
    image: redis:8.2.3@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REDIS_PASSWORD: ${SHRIKE_LOCAL_REDIS_PASSWORD:-}
    command:
      - /bin/sh
      - -ec
      - |
        test "$${#REDIS_PASSWORD}" -ge 32
        case "$$REDIS_PASSWORD" in *[!A-Za-z0-9_-]*) exit 1 ;; esac
        printf '%s\n' 'protected-mode yes' 'appendonly yes' 'maxmemory 64mb' 'maxmemory-policy noeviction' "requirepass $$REDIS_PASSWORD" | redis-server -
    ports:
      - '127.0.0.1:${SHRIKE_LOCAL_REDIS_PORT:-56379}:6379'
    volumes:
      - shrike_redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  shrike_demo_postgres:
  shrike_redis:
