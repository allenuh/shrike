[project]
name = "shrike-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.3",
    "shrike-backend",
    "sqlalchemy==2.1.8",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shrike_api"]
