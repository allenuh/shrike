[project]
name = "shrike-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["shrike-api", "shrike-worker"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/backend", "services/api", "services/worker"]

[tool.uv.sources]
shrike-api = { workspace = true }
shrike-backend = { workspace = true }
shrike-worker = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/backend/src", "services/api/src", "services/worker/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages/backend/src", "services/api/src", "services/api/alembic", "services/worker/src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires an explicitly supplied disposable PostgreSQL database"]
filterwarnings = ["error"]
